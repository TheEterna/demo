<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>愤怒的小鸟</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 100%);
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        
        #game-container {
            position: relative;
            width: 1200px;
            height: 600px;
            background: linear-gradient(to bottom, #87CEEB 0%, #98D8EA 50%, #90EE90 50%, #228B22 100%);
            border: 4px solid #333;
            border-radius: 10px;
            overflow: hidden;
        }
        
        #game-canvas {
            position: absolute;
            top: 0;
            left: 0;
        }
        
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        #score-display {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        
        #level-display {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        
        #message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            font-weight: bold;
            color: white;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.7);
            display: none;
            text-align: center;
        }
        
        #restart-btn {
            position: absolute;
            top: 60%;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 30px;
            font-size: 24px;
            background: #FF6B6B;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            display: none;
            pointer-events: auto;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }
        
        #restart-btn:hover {
            background: #FF5252;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>
        <div id="ui-layer">
            <div id="score-display">得分：0</div>
            <div id="level-display">关卡：1</div>
            <div id="message"></div>
            <button id="restart-btn">重新开始</button>
        </div>
    </div>

    <script>
        const GRAVITY = 0.5;
        const FRICTION = 0.98;
        const BOUNCE = 0.6;
        const GROUND_Y = 500;
        
        let gameState = {
            score: 0,
            level: 1,
            bird: null,
            pigs: [],
            blocks: [],
            particles: [],
            isDragging: false,
            dragStart: { x: 0, y: 0 },
            dragCurrent: { x: 0, y: 0 },
            slingPos: { x: 200, y: 400 },
            gamePhase: 'aiming',
            birdsRemaining: 3
        };
        
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 1200;
        canvas.height = 600;
        
        const scoreDisplay = document.getElementById('score-display');
        const levelDisplay = document.getElementById('level-display');
        const messageEl = document.getElementById('message');
        const restartBtn = document.getElementById('restart-btn');
        
        class Bird {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 20;
                this.vx = 0;
                this.vy = 0;
                this.rotation = 0;
                this.color = '#FF0000';
                this.isFlying = false;
            }
            
            update() {
                if (this.isFlying) {
                    this.vy += GRAVITY;
                    this.vx *= FRICTION;
                    this.vy *= FRICTION;
                    this.x += this.vx;
                    this.y += this.vy;
                    this.rotation += this.vx * 0.1;
                    
                    if (this.y + this.radius > GROUND_Y) {
                        this.y = GROUND_Y - this.radius;
                        this.vy *= -BOUNCE;
                        this.vx *= 0.8;
                        if (Math.abs(this.vy) < 1) this.vy = 0;
                    }
                    
                    if (this.x - this.radius < 0) {
                        this.x = this.radius;
                        this.vx *= -BOUNCE;
                    }
                    if (this.x + this.radius > canvas.width) {
                        this.x = canvas.width - this.radius;
                        this.vx *= -BOUNCE;
                    }
                }
            }
            
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.strokeStyle = '#8B0000';
                ctx.lineWidth = 2;
                ctx.stroke();
                
                ctx.beginPath();
                ctx.arc(6, -6, 6, 0, Math.PI * 2);
                ctx.fillStyle = 'white';
                ctx.fill();
                ctx.beginPath();
                ctx.arc(8, -6, 3, 0, Math.PI * 2);
                ctx.fillStyle = 'black';
                ctx.fill();
                
                ctx.beginPath();
                ctx.moveTo(-5, -12);
                ctx.lineTo(5, -8);
                ctx.strokeStyle = 'black';
                ctx.lineWidth = 3;
                ctx.stroke();
                
                ctx.beginPath();
                ctx.moveTo(10, 0);
                ctx.lineTo(20, 3);
                ctx.lineTo(10, 6);
                ctx.fillStyle = '#FFA500';
                ctx.fill();
                
                ctx.restore();
            }
        }
        
        class Pig {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 18;
                this.color = '#90EE90';
                this.health = 100;
                this.isAlive = true;
            }
            
            takeDamage(damage) {
                this.health -= damage;
                if (this.health <= 0) {
                    this.isAlive = false;
                    createParticles(this.x, this.y, this.color);
                    gameState.score += 500;
                    updateScore();
                } else {
                    createParticles(this.x, this.y, '#90EE90', 3);
                }
            }
            
            update() {
                if (!this.isAlive) return;
                if (this.y + this.radius < GROUND_Y) this.y += 2;
            }
            
            draw() {
                if (!this.isAlive) return;
                
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.strokeStyle = '#228B22';
                ctx.lineWidth = 2;
                ctx.stroke();
                
                ctx.beginPath();
                ctx.arc(-5, -4, 4, 0, Math.PI * 2);
                ctx.fillStyle = 'white';
                ctx.fill();
                ctx.beginPath();
                ctx.arc(5, -4, 4, 0, Math.PI * 2);
                ctx.fillStyle = 'white';
                ctx.fill();
                ctx.beginPath();
                ctx.arc(-5, -4, 2, 0, Math.PI * 2);
                ctx.fillStyle = 'black';
                ctx.fill();
                ctx.beginPath();
                ctx.arc(5, -4, 2, 0, Math.PI * 2);
                ctx.fillStyle = 'black';
                ctx.fill();
                
                ctx.beginPath();
                ctx.ellipse(0, 3, 6, 4, 0, 0, Math.PI * 2);
                ctx.fillStyle = '#66CDAA';
                ctx.fill();
                ctx.strokeStyle = '#228B22';
                ctx.lineWidth = 1;
                ctx.stroke();
                
                ctx.beginPath();
                ctx.arc(-2, 3, 1.5, 0, Math.PI * 2);
                ctx.fillStyle = '#006400';
                ctx.fill();
                ctx.beginPath();
                ctx.arc(2, 3, 1.5, 0, Math.PI * 2);
                ctx.fillStyle = '#006400';
                ctx.fill();
            }
        }
        
        class Block {
            constructor(x, y, width, height, type = 'wood') {
                this.x = x;
                this.y = y;
                this.width = width;
                this.height = height;
                this.type = type;
                this.health = 100;
                this.isDestroyed = false;
                
                if (type === 'wood') {
                    this.color = '#DEB887';
                    this.maxHealth = 100;
                } else if (type === 'stone') {
                    this.color = '#808080';
                    this.maxHealth = 200;
                } else if (type === 'ice') {
                    this.color = '#ADD8E6';
                    this.maxHealth = 50;
                }
            }
            
            takeDamage(damage) {
                this.health -= damage;
                if (this.health <= 0) {
                    this.isDestroyed = true;
                    createParticles(this.x + this.width / 2, this.y + this.height / 2, this.color, 8);
                    gameState.score += 100;
                    updateScore();
                } else {
                    createParticles(this.x + this.width / 2, this.y + this.height / 2, this.color, 3);
                }
            }
            
            draw() {
                if (this.isDestroyed) return;
                
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.width, this.height);
                ctx.strokeStyle = 'rgba(0,0,0,0.3)';
                ctx.lineWidth = 2;
                ctx.strokeRect(this.x, this.y, this.width, this.height);
                
                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(this.x + this.width, this.y + this.height);
                ctx.moveTo(this.x + this.width, this.y);
                ctx.lineTo(this.x, this.y + this.height);
                ctx.strokeStyle = 'rgba(0,0,0,0.1)';
                ctx.stroke();
                
                if (this.health < this.maxHealth * 0.5) {
                    ctx.beginPath();
                    ctx.moveTo(this.x + this.width * 0.3, this.y + this.height * 0.3);
                    ctx.lineTo(this.x + this.width * 0.7, this.y + this.height * 0.7);
                    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }
            }
            
            checkCollision(bird) {
                if (this.isDestroyed) return false;
                
                const closestX = Math.max(this.x, Math.min(bird.x, this.x + this.width));
                const closestY = Math.max(this.y, Math.min(bird.y, this.y + this.height));
                
                const dx = bird.x - closestX;
                const dy = bird.y - closestY;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance < bird.radius) {
                    const impact = Math.sqrt(bird.vx * bird.vx + bird.vy * bird.vy);
                    if (impact > 3) {
                        this.takeDamage(impact * 10);
                        const overlap = bird.radius - distance;
                        const nx = dx / distance || 0;
                        const ny = dy / distance || 0;
                        bird.x += nx * overlap;
                        bird.y += ny * overlap;
                        bird.vx *= -0.5;
                        bird.vy *= -0.5;
                    }
                    return true;
                }
                return false;
            }
        }
        
        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 10;
                this.vy = (Math.random() - 0.5) * 10;
                this.life = 1.0;
                this.decay = 0.02 + Math.random() * 0.03;
                this.color = color;
                this.size = 3 + Math.random() * 5;
            }
            
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += GRAVITY * 0.5;
                this.life -= this.decay;
            }
            
            draw() {
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }
        }
        
        function createParticles(x, y, color, count = 5) {
            for (let i = 0; i < count; i++) {
                gameState.particles.push(new Particle(x, y, color));
            }
        }
        
        function initLevel(level) {
            gameState.birdsRemaining = 3;
            gameState.gamePhase = 'aiming';
            gameState.bird = new Bird(gameState.slingPos.x, gameState.slingPos.y);
            gameState.pigs = [];
            gameState.blocks = [];
            gameState.particles = [];
            
            if (level === 1) {
                gameState.blocks = [
                    new Block(700, 450, 20, 50, 'wood'),
                    new Block(800, 450, 20, 50, 'wood'),
                    new Block(700, 400, 120, 20, 'wood'),
                    new Block(750, 350, 20, 50, 'wood')
                ];
                gameState.pigs = [new Pig(760, 482), new Pig(760, 300)];
            } else if (level === 2) {
                gameState.blocks = [
                    new Block(650, 450, 20, 50, 'stone'),
                    new Block(750, 450, 20, 50, 'stone'),
                    new Block(650, 400, 120, 20, 'wood'),
                    new Block(700, 350, 20, 50, 'ice'),
                    new Block(650, 300, 120, 20, 'wood')
                ];
                gameState.pigs = [new Pig(710, 482), new Pig(710, 382), new Pig(710, 282)];
            } else {
                gameState.blocks = [
                    new Block(600, 450, 20, 50, 'stone'),
                    new Block(700, 450, 20, 50, 'stone'),
                    new Block(800, 450, 20, 50, 'stone'),
                    new Block(600, 400, 120, 20, 'wood'),
                    new Block(700, 400, 120, 20, 'wood'),
                    new Block(650, 350, 20, 50, 'ice'),
                    new Block(750, 350, 20, 50, 'ice'),
                    new Block(650, 300, 120, 20, 'wood')
                ];
                gameState.pigs = [new Pig(660, 482), new Pig(760, 482), new Pig(710, 382), new Pig(710, 282)];
            }
            
            updateScore();
            hideMessage();
        }
        
        function updateScore() {
            scoreDisplay.textContent = `得分：${gameState.score}`;
            levelDisplay.textContent = `关卡：${gameState.level}`;
        }
        
        function showMessage(text) {
            messageEl.textContent = text;
            messageEl.style.display = 'block';
        }
        
        function hideMessage() {
            messageEl.style.display = 'none';
            restartBtn.style.display = 'none';
        }
        
        function checkGameEnd() {
            const alivePigs = gameState.pigs.filter(pig => pig.isAlive).length;
            
            if (alivePigs === 0) {
                gameState.gamePhase = 'ended';
                showMessage('🎉 关卡完成！🎉');
                restartBtn.style.display = 'block';
                restartBtn.onclick = () => {
                    gameState.level++;
                    gameState.score += 1000;
                    initLevel(gameState.level);
                };
                return;
            }
            
            if (gameState.bird && gameState.bird.isFlying) {
                const speed = Math.sqrt(gameState.bird.vx * gameState.bird.vx + gameState.bird.vy * gameState.bird.vy);
                
                if (speed < 0.5 && gameState.bird.y > GROUND_Y - gameState.bird.radius - 1) {
                    if (gameState.birdsRemaining > 0) {
                        gameState.birdsRemaining--;
                        setTimeout(() => {
                            if (gameState.gamePhase !== 'ended') {
                                gameState.bird = new Bird(gameState.slingPos.x, gameState.slingPos.y);
                                gameState.gamePhase = 'aiming';
                            }
                        }, 1000);
                    } else {
                        gameState.gamePhase = 'ended';
                        showMessage('😢 游戏结束！😢');
                        restartBtn.style.display = 'block';
                        restartBtn.onclick = () => {
                            gameState.level = 1;
                            gameState.score = 0;
                            initLevel(1);
                        };
                    }
                }
            }
        }
        
        function drawSlingshot() {
            const slingX = gameState.slingPos.x;
            const slingY = gameState.slingPos.y;
            
            ctx.beginPath();
            ctx.moveTo(slingX - 10, slingY);
            ctx.lineTo(slingX - 10, GROUND_Y);
            ctx.moveTo(slingX + 10, slingY);
            ctx.lineTo(slingX + 10, GROUND_Y);
            ctx.strokeStyle = '#8B4513';
            ctx.lineWidth = 8;
            ctx.stroke();
            
            if (gameState.isDragging && gameState.gamePhase === 'aiming') {
                ctx.beginPath();
                ctx.moveTo(slingX - 10, slingY);
                ctx.lineTo(gameState.dragCurrent.x, gameState.dragCurrent.y);
                ctx.lineTo(slingX + 10, slingY);
                ctx.strokeStyle = '#654321';
                ctx.lineWidth = 6;
                ctx.stroke();
            } else {
                ctx.beginPath();
                ctx.moveTo(slingX - 10, slingY);
                ctx.lineTo(slingX, slingY);
                ctx.lineTo(slingX + 10, slingY);
                ctx.strokeStyle = '#654321';
                ctx.lineWidth = 6;
                ctx.stroke();
            }
        }
        
        function drawGround() {
            ctx.fillStyle = '#228B22';
            ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);
            ctx.fillStyle = '#32CD32';
            for (let i = 0; i < canvas.width; i += 20) {
                ctx.beginPath();
                ctx.arc(i, GROUND_Y, 10, 0, Math.PI);
                ctx.fill();
            }
        }
        
        function drawClouds() {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.beginPath();
            ctx.arc(150, 80, 30, 0, Math.PI * 2);
            ctx.arc(190, 80, 40, 0, Math.PI * 2);
            ctx.arc(230, 80, 30, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.beginPath();
            ctx.arc(600, 120, 25, 0, Math.PI * 2);
            ctx.arc(635, 120, 35, 0, Math.PI * 2);
            ctx.arc(670, 120, 25, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.beginPath();
            ctx.arc(950, 60, 35, 0, Math.PI * 2);
            ctx.arc(1000, 60, 45, 0, Math.PI * 2);
            ctx.arc(1050, 60, 35, 0, Math.PI * 2);
            ctx.fill();
        }
        
        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            drawClouds();
            drawGround();
            drawSlingshot();
            
            if (gameState.bird) {
                gameState.bird.update();
                gameState.bird.draw();
                
                if (gameState.bird.isFlying) {
                    gameState.blocks.forEach(block => block.checkCollision(gameState.bird));
                    
                    gameState.pigs.forEach(pig => {
                        if (pig.isAlive) {
                            const dx = gameState.bird.x - pig.x;
                            const dy = gameState.bird.y - pig.y;
                            const distance = Math.sqrt(dx * dx + dy * dy);
                            
                            if (distance < gameState.bird.radius + pig.radius) {
                                const impact = Math.sqrt(gameState.bird.vx * gameState.bird.vx + gameState.bird.vy * gameState.bird.vy);
                                if (impact > 2) {
                                    pig.takeDamage(impact * 15);
                                }
                            }
                        }
                    });
                }
            }
            
            gameState.pigs.forEach(pig => { pig.update(); pig.draw(); });
            gameState.blocks.forEach(block => block.draw());
            
            gameState.particles = gameState.particles.filter(p => p.life > 0);
            gameState.particles.forEach(particle => { particle.update(); particle.draw(); });
            
            checkGameEnd();
            requestAnimationFrame(gameLoop);
        }
        
        canvas.addEventListener('mousedown', (e) => {
            if (gameState.gamePhase !== 'aiming') return;
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            const dx = mouseX - gameState.bird.x;
            const dy = mouseY - gameState.bird.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            
            if (distance < 50) {
                gameState.isDragging = true;
                gameState.dragStart = { x: mouseX, y: mouseY };
                gameState.dragCurrent = { x: mouseX, y: mouseY };
            }
        });
        
        canvas.addEventListener('mousemove', (e) => {
            if (!gameState.isDragging) return;
            const rect = canvas.getBoundingClientRect();
            gameState.dragCurrent = { x: e.clientX - rect.left, y: e.clientY - rect.top };
        });
        
        canvas.addEventListener('mouseup', (e) => {
            if (!gameState.isDragging) return;
            gameState.isDragging = false;
            
            const dx = gameState.slingPos.x - gameState.dragCurrent.x;
            const dy = gameState.slingPos.y - gameState.dragCurrent.y;
            const maxPower = 150;
            const power = Math.min(Math.sqrt(dx * dx + dy * dy), maxPower);
            const angle = Math.atan2(dy, dx);
            const powerMultiplier = 0.15;
            
            gameState.bird.vx = Math.cos(angle) * power * powerMultiplier;
            gameState.bird.vy = Math.sin(angle) * power * powerMultiplier;
            gameState.bird.isFlying = true;
            gameState.gamePhase = 'flying';
        });
        
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (gameState.gamePhase !== 'aiming') return;
            const rect = canvas.getBoundingClientRect();
            const touchX = e.touches[0].clientX - rect.left;
            const touchY = e.touches[0].clientY - rect.top;
            const dx = touchX - gameState.bird.x;
            const dy = touchY - gameState.bird.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            
            if (distance < 50) {
                gameState.isDragging = true;
                gameState.dragStart = { x: touchX, y: touchY };
                gameState.dragCurrent = { x: touchX, y: touchY };
            }
        });
        
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (!gameState.isDragging) return;
            const rect = canvas.getBoundingClientRect();
            gameState.dragCurrent = { x: e.touches[0].clientX - rect.left, y: e.touches[0].clientY - rect.top };
        });
        
        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            if (!gameState.isDragging) return;
            gameState.isDragging = false;
            
            const dx = gameState.slingPos.x - gameState.dragCurrent.x;
            const dy = gameState.slingPos.y - gameState.dragCurrent.y;
            const maxPower = 150;
            const power = Math.min(Math.sqrt(dx * dx + dy * dy), maxPower);
            const angle = Math.atan2(dy, dx);
            const powerMultiplier = 0.15;
            
            gameState.bird.vx = Math.cos(angle) * power * powerMultiplier;
            gameState.bird.vy = Math.sin(angle) * power * powerMultiplier;
            gameState.bird.isFlying = true;
            gameState.gamePhase = 'flying';
        });
        
        initLevel(1);
        gameLoop();
    </script>
</body>
</html>
